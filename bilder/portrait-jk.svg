<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6F0FF"/>
      <stop offset="100%" stop-color="#F7FAFD"/>
    </linearGradient>
  </defs>
  <rect width="200" height="240" fill="url(#bg1)" rx="16"/>

  <!-- White coat body -->
  <path d="M60 160 Q60 145 80 140 L100 135 L120 140 Q140 145 140 160 L145 240 L55 240 Z" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <!-- Collar -->
  <path d="M85 140 L100 155 L115 140" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
  <!-- Blue shirt underneath -->
  <path d="M88 142 L100 152 L112 142" fill="#5B92E5" opacity="0.3"/>

  <!-- Neck -->
  <rect x="90" y="118" width="20" height="22" fill="#F0D5B8" rx="6"/>

  <!-- Head -->
  <ellipse cx="100" cy="95" rx="36" ry="40" fill="#F0D5B8"/>

  <!-- Hair -->
  <ellipse cx="100" cy="70" rx="38" ry="22" fill="#8B5E3C"/>
  <ellipse cx="70" cy="85" rx="10" ry="25" fill="#8B5E3C"/>
  <ellipse cx="130" cy="85" rx="10" ry="25" fill="#8B5E3C"/>
  <path d="M62 80 Q65 55 100 50 Q135 55 138 80" fill="#8B5E3C"/>

  <!-- Eyes -->
  <ellipse cx="86" cy="95" rx="4" ry="3.5" fill="#22313F"/>
  <ellipse cx="114" cy="95" rx="4" ry="3.5" fill="#22313F"/>
  <circle cx="87.5" cy="94" r="1" fill="#FFFFFF"/>
  <circle cx="115.5" cy="94" r="1" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M78 87 Q86 83 94 87" fill="none" stroke="#6B4226" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M106 87 Q114 83 122 87" fill="none" stroke="#6B4226" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M98 100 Q100 108 102 100" fill="none" stroke="#D4B8A0" stroke-width="1.2"/>

  <!-- Smile -->
  <path d="M88 112 Q100 122 112 112" fill="none" stroke="#C4947A" stroke-width="2" stroke-linecap="round"/>

  <!-- Stethoscope -->
  <path d="M80 160 Q75 180 85 195" fill="none" stroke="#5EC4B6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="85" cy="197" r="6" fill="#5EC4B6"/>
  <circle cx="85" cy="197" r="3" fill="#4DB3A5"/>

  <!-- Name badge -->
  <rect x="108" y="165" width="22" height="14" fill="#5B92E5" rx="2" opacity="0.8"/>
  <rect x="111" y="170" width="16" height="2" fill="#FFFFFF" rx="1"/>
</svg>
