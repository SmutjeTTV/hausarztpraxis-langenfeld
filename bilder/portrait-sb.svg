<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6F0FF"/>
      <stop offset="100%" stop-color="#F7FAFD"/>
    </linearGradient>
  </defs>
  <rect width="200" height="240" fill="url(#bg3)" rx="16"/>

  <!-- White coat -->
  <path d="M58 158 Q58 143 80 138 L100 133 L120 138 Q142 143 142 158 L147 240 L53 240 Z" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <path d="M86 138 L100 151 L114 138" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>
  <path d="M89 140 L100 149 L111 140" fill="#5EC4B6" opacity="0.3"/>

  <!-- Neck -->
  <rect x="90" y="116" width="20" height="22" fill="#F2DAC0"/>

  <!-- Head -->
  <ellipse cx="100" cy="92" rx="35" ry="39" fill="#F2DAC0"/>

  <!-- Hair (longer, female) -->
  <ellipse cx="100" cy="66" rx="38" ry="20" fill="#2C1810"/>
  <ellipse cx="65" cy="88" rx="10" ry="30" fill="#2C1810"/>
  <ellipse cx="135" cy="88" rx="10" ry="30" fill="#2C1810"/>
  <path d="M62 78 Q65 50 100 46 Q135 50 138 78" fill="#2C1810"/>
  <!-- Hair falling on shoulders -->
  <ellipse cx="62" cy="130" rx="8" ry="22" fill="#2C1810"/>
  <ellipse cx="138" cy="130" rx="8" ry="22" fill="#2C1810"/>

  <!-- Eyes -->
  <ellipse cx="86" cy="93" rx="4" ry="3.5" fill="#22313F"/>
  <ellipse cx="114" cy="93" rx="4" ry="3.5" fill="#22313F"/>
  <circle cx="87.5" cy="92" r="1" fill="#FFFFFF"/>
  <circle cx="115.5" cy="92" r="1" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M78 85 Q86 81 94 85" fill="none" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M106 85 Q114 81 122 85" fill="none" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M98 99 Q100 106 102 99" fill="none" stroke="#D8BCA0" stroke-width="1.2"/>

  <!-- Smile -->
  <path d="M89 110 Q100 118 111 110" fill="none" stroke="#C49878" stroke-width="2" stroke-linecap="round"/>

  <!-- Stethoscope -->
  <path d="M82 158 Q77 178 87 193" fill="none" stroke="#5EC4B6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="87" cy="195" r="6" fill="#5EC4B6"/>
  <circle cx="87" cy="195" r="3" fill="#4DB3A5"/>

  <!-- Name badge -->
  <rect x="108" y="163" width="22" height="14" fill="#5EC4B6" rx="2" opacity="0.8"/>
  <rect x="111" y="168" width="16" height="2" fill="#FFFFFF" rx="1"/>
</svg>
